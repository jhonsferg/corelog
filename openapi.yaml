openapi: 3.0.3
info:
  title: CoreLog API
  description: Incident management and ticket resolution API for CoreLog.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
tags:
  - name: auth
    description: Registration and authentication
  - name: users
    description: User identity, profile, and directory search
  - name: teams
    description: Team management and membership
  - name: tickets
    description: Incident and ticket management
  - name: health
    description: Service liveness
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create a user account
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: The email address is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate and receive an access token
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSession'
        '401':
          description: The email or password is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/me:
    get:
      tags: [users]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [users]
      summary: Update the current user's profile
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The email address is already registered to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/me/password:
    post:
      tags: [users]
      summary: Change the current user's password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password was changed successfully
        '401':
          description: Not authenticated, or the supplied current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/search:
    get:
      tags: [users]
      summary: Search users within the current user's own team
      description: >-
        Returns an empty list when the current user does not belong to a team, since there is
        nobody they are allowed to search for or assign tickets to.
      operationId: searchTeammates
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text match against name and email.
          schema:
            type: string
      responses:
        '200':
          description: Teammates matching the search query
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags: [users]
      summary: List or search all users
      description: Administrator only. Unlike /users/search, this is not restricted to the caller's own team.
      operationId: listUsers
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text match against name and email.
          schema:
            type: string
        - name: team_id
          in: query
          required: false
          description: Restrict results to members of this team. Omit to search across every team.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Users matching the given filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{id}/team:
    patch:
      tags: [users]
      summary: Assign or clear a user's team
      description: Administrator only.
      operationId: setUserTeam
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTeamRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /teams:
    get:
      tags: [teams]
      summary: List all teams
      operationId: listTeams
      responses:
        '200':
          description: Every team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [teams]
      summary: Create a team
      description: Administrator only.
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A team with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /teams/{id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      summary: Get a team by id
      operationId: getTeam
      responses:
        '200':
          description: The requested team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [teams]
      summary: Rename a team
      description: Administrator only.
      operationId: renameTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTeamRequest'
      responses:
        '200':
          description: The renamed team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A team with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [teams]
      summary: Delete a team
      description: Administrator only. Members of the deleted team are left without a team rather than being deleted themselves.
      operationId: deleteTeam
      responses:
        '204':
          description: The team was deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tickets:
    post:
      tags: [tickets]
      summary: Create a ticket
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [tickets]
      summary: List tickets
      operationId: listTickets
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by ticket status. When absent, tickets of every status are returned.
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: priority
          in: query
          required: false
          description: Filter by ticket priority. When absent, tickets of every priority are returned.
          schema:
            $ref: '#/components/schemas/TicketPriority'
        - name: page
          in: query
          required: false
          description: One-based page number. Defaults to 1 when absent or invalid.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: Number of tickets per page. Defaults to 20 and is capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of tickets matching the given filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [tickets]
      summary: Get a ticket by id
      operationId: getTicket
      responses:
        '200':
          description: The requested ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tickets/{id}/status:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    patch:
      tags: [tickets]
      summary: Transition a ticket's status
      description: >-
        Valid transitions are open to in_progress, open to closed, in_progress to resolved,
        in_progress to closed, resolved to closed, and resolved to in_progress. Any other
        transition is rejected with 409.
      operationId: updateTicketStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketStatusRequest'
      responses:
        '200':
          description: The ticket with its updated status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The requested status transition is not allowed from the ticket's current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tickets/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    patch:
      tags: [tickets]
      summary: Assign a ticket to a user
      description: >-
        Assigning an open ticket also transitions its status to in_progress. Assigning a
        ticket in any other status only changes the assignee. The assignee must belong to
        the same team as the authenticated user making the request, otherwise this returns
        403.
      operationId: assignTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTicketRequest'
      responses:
        '200':
          description: The ticket with its updated assignee
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The assignee does not belong to the same team as the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /health:
    get:
      tags: [health]
      summary: Liveness check
      description: Mounted at the server root, outside the /api/v1 prefix used by every other endpoint.
      operationId: getHealth
      security: []
      servers:
        - url: http://localhost:8080
          description: Server root, without the /api/v1 prefix
      responses:
        '200':
          description: The service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      description: The ticket's unique identifier
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      description: The user's unique identifier
      schema:
        type: string
        format: uuid
    TeamId:
      name: id
      in: path
      required: true
      description: The team's unique identifier
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: The request is missing a valid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No resource exists with the given identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated user is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: The request body failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Role:
      type: string
      enum: [admin, agent, requester]
    TicketStatus:
      type: string
      enum: [open, in_progress, resolved, closed]
    TicketPriority:
      type: string
      enum: [low, medium, high, critical]
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
        password:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        team_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
    SetTeamRequest:
      type: object
      properties:
        team_id:
          type: string
          format: uuid
          nullable: true
          description: Set to null to remove the user from their current team.
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
    RenameTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
    AuthSession:
      type: object
      properties:
        token:
          type: string
          description: A signed JWT access token, valid for the duration configured by JWT_EXPIRATION on the server.
        user:
          $ref: '#/components/schemas/User'
    CreateTicketRequest:
      type: object
      required: [title, description, priority]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          minLength: 3
        priority:
          $ref: '#/components/schemas/TicketPriority'
    UpdateTicketStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
    AssignTicketRequest:
      type: object
      required: [assignee_id]
      properties:
        assignee_id:
          type: string
          format: uuid
    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        requester_id:
          type: string
          format: uuid
        assignee_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              example: a valid email is required
security:
  - bearerAuth: []
