services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-corelog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-corelog}
      POSTGRES_DB: ${DB_NAME:-corelog}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - corelog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-corelog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-corelog}
      DB_PASSWORD: ${DB_PASSWORD:-corelog}
      DB_NAME: ${DB_NAME:-corelog}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRATION: 24h
    ports:
      - "8080:8080"

  ui:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  corelog_db_data:
