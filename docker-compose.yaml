services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-corelog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-corelog}
      POSTGRES_DB: ${DB_NAME:-corelog}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - corelog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-corelog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations/postgres:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER:-corelog}:${DB_PASSWORD:-corelog}@db:5432/${DB_NAME:-corelog}?sslmode=disable"
      - "up"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-corelog}
      DB_PASSWORD: ${DB_PASSWORD:-corelog}
      DB_NAME: ${DB_NAME:-corelog}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRATION: 24h
    ports:
      - "8080:8080"

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  corelog_db_data:
