name: Release

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Classify changed files
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          skip_patterns=(
            '*.md'
            'docs/*'
            '.github/*'
            '*.gitignore'
            '.golangci.yml'
            '*.env.example'
          )

          changed="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"

          code=false

          while IFS= read -r file; do
            if [ -z "${file}" ]; then
              continue
            fi

            skip=false
            for pattern in "${skip_patterns[@]}"; do
              case "${file}" in
                ${pattern}) skip=true; break ;;
              esac
            done

            if [ "${skip}" = false ]; then
              code=true
              break
            fi
          done <<< "${changed}"

          echo "code=${code}" >> "${GITHUB_OUTPUT}"

          if [ "${code}" = true ]; then
            echo "At least one functional file changed; a release will be created."
          else
            echo "Only documentation or repository metadata changed; no release."
          fi

  release:
    name: release
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail

          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [ -z "${last_tag}" ]; then
            {
              echo "previous=none"
              echo "next=v0.1.0"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          base="${last_tag#v}"
          base="${base%%-*}"
          IFS='.' read -r major minor patch <<< "${base}"

          {
            echo "previous=${last_tag}"
            echo "next=v${major}.${minor}.$((patch + 1))"
          } >> "${GITHUB_OUTPUT}"

      - name: Build release notes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail

          {
            echo "## ${PR_TITLE:-Untitled pull request}"
            echo ""

            if [ -n "${PR_BODY:-}" ]; then
              printf '%s\n' "${PR_BODY}"
            else
              echo "_No pull request description was provided._"
            fi

            echo ""
            echo "---"
            echo ""
            echo "**Pull request:** #${PR_NUMBER} by @${PR_AUTHOR} (\`${PR_BRANCH}\`)"

            if [ "${PREVIOUS}" != "none" ]; then
              echo ""
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${NEXT}"
            fi

            echo ""
            echo "### What changed"
            echo ""
            if [ "${PREVIOUS}" != "none" ]; then
              git log --oneline --no-merges "${PREVIOUS}..HEAD" | sed 's/^/- /'
            else
              git log --oneline --no-merges -20 | sed 's/^/- /'
            fi

            echo ""
            echo "### Files changed"
            echo ""
            if [ "${PREVIOUS}" != "none" ]; then
              git diff --name-status "${PREVIOUS}..HEAD" | sed 's/^/- /'
            else
              git show --name-status --format="" HEAD | sed '/^$/d' | sed 's/^/- /'
            fi
          } > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail

          if gh release view "${NEXT}" > /dev/null 2>&1; then
            echo "Release ${NEXT} already exists, nothing to do."
            exit 0
          fi

          gh release create "${NEXT}" \
            --title "${NEXT}" \
            --notes-file release-notes.md \
            --target "$(git rev-parse HEAD)"
