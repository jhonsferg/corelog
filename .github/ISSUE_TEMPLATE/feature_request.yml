name: Feature request
description: Suggest an idea, improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Describe the problem first, then
        the solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem does this feature address? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A clear description of what you would like to happen.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the monorepo would this affect?
      options:
        - Backend (Go)
        - Frontend (React)
        - Database / migrations
        - Docker / deployment
        - Documentation
        - CI / GitHub Actions
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links or anything else that helps.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues for duplicates
          required: true
